<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Gram-negative envelope, fixed still</title>
  <desc id="desc">Outside to inside: beta-lactam, outer membrane with one porin, periplasm, thin wall, inner membrane, cytoplasm.</desc>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text x="64" y="58" fill="#0F172A" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700">Gram-negative envelope</text>
  <text x="64" y="90" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="16">Still frame. Outside is at the top. The drug has not entered.</text>

  <g transform="translate(360,130)">
    <rect x="0" y="0" width="560" height="64" fill="#FFF7ED"/>
    <circle cx="280" cy="32" r="14" fill="none" stroke="#F97316" stroke-width="5"/>
    <text x="308" y="38" fill="#9A3412" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Beta-lactam</text>

    <rect x="0" y="64" width="560" height="36" fill="#0F766E"/>
    <rect x="248" y="64" width="64" height="36" fill="#14B8A6"/>
    <rect x="262" y="74" width="36" height="16" rx="8" fill="#F8FAFC"/>
    <text x="16" y="88" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Outer membrane</text>

    <rect x="0" y="100" width="560" height="90" fill="#ECFEFF"/>
    <text x="16" y="152" fill="#0F766E" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Periplasm</text>

    <rect x="0" y="190" width="560" height="22" fill="#F97316"/>
    <g stroke="#FFF7ED" stroke-width="2">
      <path d="M120 197 H560"/>
      <path d="M120 205 H560"/>
    </g>
    <text x="16" y="206" fill="#FFF7ED" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Wall</text>

    <rect x="0" y="208" width="560" height="28" fill="#0B1628"/>
    <text x="16" y="228" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Inner membrane</text>

    <rect x="0" y="236" width="560" height="150" fill="#E2E8F0"/>
    <text x="16" y="318" fill="#475569" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Cytoplasm</text>
    <text x="16" y="344" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="14">Not the target in this video</text>
  </g>

  <text x="940" y="218" fill="#0F766E" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Porin</text>
</svg>
